<!-- ============================================================== -->
<!-- Left Sidebar - style you can find in sidebar.scss  -->
<!-- ============================================================== -->
<aside class="left-sidebar">
    <!-- Sidebar scroll-->
    <div class="scroll-sidebar">
        <!-- Sidebar navigation-->
        <nav class="sidebar-nav ">
            <ul id="sidebar-nav ">
                <li class="nav-item">
                    <a class="nav-link collapsed cursor" routerLink="/">
                        <i class="fa fa-home"></i>
                        <span>Inicio</span>
                    </a>
                </li>

                <li class="nav-item"
                    *ngIf="user.role === 'SUPERADMIN' || user.role === 'ADMIN' || user.role === 'EDITOR' ">
                    <a class="nav-link collapsed cursor" routerLink="/dashboard/retadores" routerLinkActive="active">
                        <i class="fa fa-users"></i>
                        <span>Retadores</span>
                    </a>
                </li>
                <li class="nav-item"
                    *ngIf="user.role === 'SUPERADMIN' || user.role === 'ADMIN' || user.role === 'EDITOR' ">
                    <a class="nav-link collapsed cursor" routerLink="/dashboard/auditoria-ia" routerLinkActive="active">
                        <i class="fa-solid fa-robot"></i>
                        <span>Auditoria IA</span>
                    </a>
                </li>
                <li class="nav-item"
                    *ngIf="user.role === 'SUPERADMIN' || user.role === 'ADMIN' || user.role === 'EDITOR' ">
                    <a class="nav-link collapsed cursor" routerLink="/dashboard/tips" routerLinkActive="active">
                        <i class="fa-solid fa-lightbulb"></i>
                        <span>Consejos</span>
                    </a>
                </li>
                <li class="nav-item"
                    *ngIf="user.role === 'SUPERADMIN' || user.role === 'ADMIN' || user.role === 'EDITOR' ">
                    <a class="nav-link collapsed cursor" routerLink="/dashboard/reglas" routerLinkActive="active">
                        <i class="fa-regular fa-file-lines"></i>
                        <span>Reglas</span>
                    </a>
                </li>
                <li class="nav-item"
                    *ngIf="user.role === 'SUPERADMIN' || user.role === 'ADMIN' || user.role === 'EDITOR' ">
                    <a class="nav-link collapsed cursor" routerLink="/dashboard/terminos" routerLinkActive="active">
                        <i class="fa-solid fa-scale-balanced"></i>
                        <span>Terminos</span>
                    </a>
                </li>


                <li class="nav-item"
                    *ngIf="user.role === 'SUPERADMIN' || user.role === 'ADMIN' || user.role === 'EDITOR' ">
                    <a class="nav-link collapsed cursor" routerLink="/dashboard/users" routerLinkActive="active">
                        <i class="fa-solid fa-users-gear"></i>
                        <span>Usuarios</span>
                    </a>
                </li>

                <li class="nav-item"
                    *ngIf="user.role === 'SUPERADMIN' || user.role === 'ADMIN' || user.role === 'EDITOR' ">
                    <a class="nav-link collapsed cursor" routerLink="/dashboard/roles" routerLinkActive="active">
                        <i class="fa fa-cogs"> </i>
                        <span>Roles</span>
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link collapsed cursor" [routerLink]="['/dashboard/profile/', user.uid]"
                        routerLinkActive="active">
                        <i class="fa fa-user"></i>
                        <span>Mi Cuenta</span>
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link collapsed cursor" (click)="logout()">
                        <i class="fa fa-power-off"></i>
                        <span>Salir</span>
                    </a>
                </li>

            </ul>
        </nav>
        <!-- End Sidebar navigation -->
    </div>
    <!-- End Sidebar scroll-->
</aside>
<!-- ============================================================== -->
<!-- End Left Sidebar - style you can find in sidebar.scss  -->
<!-- ============================================================== -->
